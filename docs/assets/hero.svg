<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">qwen-code-claude-runtime</title>
  <desc id="desc">Run Qwen Code turns on your own local Claude Code CLI. Qwen Code talks to qcr, which runs the claude CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1428"/>
      <stop offset="1" stop-color="#231a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#f0a35e"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <!-- Opaque card: renders the same on GitHub light and dark themes. -->
  <rect x="1" y="1" width="1438" height="398" rx="28" fill="url(#bg)" stroke="#3a3f66" stroke-width="2"/>
  <rect x="1" y="1" width="1438" height="398" rx="28" fill="url(#dots)"/>
  <rect x="80" y="70" width="96" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="128" class="mono" font-size="22" fill="#9aa3c7">$ qcr serve</text>
  <text x="80" y="196" class="mono" font-size="58" font-weight="700" fill="#f5f7ff">qwen-code-claude-runtime</text>
  <text x="80" y="246" class="sans" font-size="28" fill="#c9d1ea">Run Qwen Code turns on your own local Claude Code CLI.</text>

  <!-- Flow: Qwen Code -> qcr -> claude CLI -->
  <g class="mono" font-size="22" text-anchor="middle">
    <rect x="80" y="286" width="176" height="48" rx="24" fill="#1b2142" stroke="#8b7cf6" stroke-width="2"/>
    <text x="168" y="317" fill="#e6e9f8">Qwen Code</text>
    <path d="M268 310 H318" stroke="#9aa3c7" stroke-width="2.5" fill="none"/>
    <path d="M318 302 L330 310 L318 318 Z" fill="#9aa3c7"/>
    <rect x="342" y="286" width="104" height="48" rx="24" fill="#2a2150" stroke="url(#accent)" stroke-width="2"/>
    <text x="394" y="317" fill="#ffffff" font-weight="700">qcr</text>
    <path d="M458 310 H508" stroke="#9aa3c7" stroke-width="2.5" fill="none"/>
    <path d="M508 302 L520 310 L508 318 Z" fill="#9aa3c7"/>
    <rect x="532" y="286" width="190" height="48" rx="24" fill="#2b1f22" stroke="#f0a35e" stroke-width="2"/>
    <text x="627" y="317" fill="#f8e7d8">claude CLI</text>
  </g>

  <!-- Terminal panel echoing what Qwen Code shows for a Claude turn. -->
  <g transform="translate(1004 92)">
    <rect width="356" height="220" rx="16" fill="#0b0f20" stroke="#3a3f66" stroke-width="2"/>
    <circle cx="26" cy="24" r="6" fill="#f0a35e" fill-opacity="0.85"/>
    <circle cx="46" cy="24" r="6" fill="#8b7cf6" fill-opacity="0.85"/>
    <circle cx="66" cy="24" r="6" fill="#9aa3c7" fill-opacity="0.6"/>
    <g class="mono" font-size="18">
      <text x="24" y="78" fill="#9aa3c7">&gt; Read · src/app.ts</text>
      <text x="24" y="110" fill="#9aa3c7">&gt; Bash · npm test</text>
      <text x="24" y="148" fill="#e6e9f8">All tests pass.</text>
      <text x="24" y="190" fill="#7d86ad" font-style="italic">claude-code · 2 turns</text>
    </g>
  </g>
</svg>
